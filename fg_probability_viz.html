<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FG Probability Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0d1f17; color: #f8f8f2; font-family: 'DM Mono', monospace; }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 5px; background: #2d5a3d; border-radius: 3px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #f5c518; cursor: pointer; box-shadow: 0 0 6px rgba(245,197,24,0.4); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1f17; }
    ::-webkit-scrollbar-thumb { background: #2d5a3d; border-radius: 3px; }
    button { font-family: 'DM Mono', monospace; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function() {
  const { useState } = React;
  const {
    AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip,
    ResponsiveContainer, RadarChart, PolarGrid, PolarAngleAxis, Radar
  } = Recharts;
  const h = React.createElement;

  // ── Colours ──────────────────────────────────────────────────────────────
  const GOLD     = "#f5c518";
  const WHITE    = "#f8f8f2";
  const LIGHT    = "#e8e8e0";
  const DARK     = "#0d1f17";
  const ACCENT   = "#4ade80";
  const DANGER   = "#f87171";
  const NFL_GREEN = "#1a472a";

  // ── Model ─────────────────────────────────────────────────────────────────
  function fgProb({ kick_distance, is_dome, wind, temp, fg_make_rate_roll6 = 0.80, surface_is_grass = true }) {
    const wind_adj = is_dome ? 0 : wind;
    const temp_adj = is_dome ? 72 : temp;
    const logit =
      5.2
      + -0.072 * kick_distance
      +  0.35  * (is_dome ? 1 : 0)
      + -0.028 * wind_adj
      +  0.008 * (temp_adj - 55)
      +  3.2   * (fg_make_rate_roll6 - 0.80)
      + -0.12  * (surface_is_grass ? 1 : 0);
    return 1 / (1 + Math.exp(-logit));
  }

  // ── Gauge ─────────────────────────────────────────────────────────────────
  function ProbGauge({ prob }) {
    const pct    = Math.round(prob * 100);
    const color  = prob > 0.75 ? ACCENT : prob > 0.5 ? GOLD : DANGER;
    const circ   = 2 * Math.PI * 52;
    const offset = circ * (1 - prob);
    return h('svg', { width: 130, height: 130, viewBox: "0 0 130 130" },
      h('circle', { cx: 65, cy: 65, r: 52, fill: "none", stroke: "#2d5a3d", strokeWidth: 11 }),
      h('circle', { cx: 65, cy: 65, r: 52, fill: "none", stroke: color, strokeWidth: 11,
        strokeDasharray: circ, strokeDashoffset: offset, strokeLinecap: "round",
        transform: "rotate(-90 65 65)",
        style: { transition: "stroke-dashoffset 0.4s ease, stroke 0.3s" }
      }),
      h('text', { x: 65, y: 60, textAnchor: "middle", fill: WHITE, fontSize: 26,
        fontFamily: "'DM Mono',monospace", fontWeight: "700" }, pct + "%"),
      h('text', { x: 65, y: 78, textAnchor: "middle", fill: "#8aaa96", fontSize: 10,
        fontFamily: "'DM Mono',monospace" }, "P(MAKE)")
    );
  }

  // ── Slider ────────────────────────────────────────────────────────────────
  function Slider({ label, value, min, max, step = 1, unit = "", onChange, fmt }) {
    return h('div', { style: { marginBottom: 13 } },
      h('div', { style: { display: "flex", justifyContent: "space-between", marginBottom: 4 } },
        h('span', { style: { color: "#8aaa96", fontSize: 11, letterSpacing: "0.04em" } }, label),
        h('span', { style: { color: GOLD, fontSize: 12, fontWeight: 700 } },
          (fmt ? fmt(value) : value) + unit)
      ),
      h('input', { type: "range", min, max, step, value,
        onChange: ev => onChange(+ev.target.value) })
    );
  }

  // ── Toggle ────────────────────────────────────────────────────────────────
  function Toggle({ label, value, onChange }) {
    return h('div', { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 } },
      h('span', { style: { color: "#8aaa96", fontSize: 11 } }, label),
      h('button', {
        onClick: () => onChange(!value),
        style: { width: 42, height: 22, borderRadius: 11, border: "none", cursor: "pointer",
          background: value ? GOLD : "#2d5a3d", position: "relative", transition: "background 0.2s" }
      },
        h('span', { style: { position: "absolute", top: 2, left: value ? 21 : 2,
          width: 18, height: 18, borderRadius: "50%",
          background: value ? DARK : "#4a7a5a", transition: "left 0.2s" } })
      )
    );
  }

  // ── Shared chart config ───────────────────────────────────────────────────
  const TABS     = ["Distance", "Wind & Temp", "Kicker Form", "Radar"];
  const axStyle  = { fontSize: 10, fill: "#8aaa96", fontFamily: "'DM Mono',monospace" };
  const ttStyle  = {
    contentStyle: { background: "#0f2219", border: "1px solid #2d5a3d", borderRadius: 8,
      fontFamily: "'DM Mono',monospace", fontSize: 12 },
    labelStyle: { color: GOLD },
    itemStyle:  { color: WHITE }
  };
  const margin   = { top: 6, right: 6, bottom: 6, left: -18 };
  const pctFmt   = v => Math.round(v * 100) + "%";

  function GradDef({ id, color }) {
    return h('defs', null,
      h('linearGradient', { id, x1: "0", y1: "0", x2: "0", y2: "1" },
        h('stop', { offset: "5%",  stopColor: color, stopOpacity: 0.35 }),
        h('stop', { offset: "95%", stopColor: color, stopOpacity: 0    })
      )
    );
  }

  function StatCard({ label, prob }) {
    const col = prob > 0.75 ? ACCENT : prob > 0.55 ? GOLD : DANGER;
    return h('div', {
      style: { background: "#0f2219", border: "1px solid " + col + "40",
        borderRadius: 8, padding: "12px 8px", textAlign: "center" }
    },
      h('div', { style: { fontSize: 20, fontFamily: "'Bebas Neue',sans-serif", color: col } },
        Math.round(prob * 100) + "%"),
      h('div', { style: { fontSize: 9, color: "#4a7a5a", marginTop: 2 } }, label)
    );
  }

  // ── Main App ──────────────────────────────────────────────────────────────
  function App() {
    const [dist,    setDist]    = useState(40);
    const [wind,    setWind]    = useState(8);
    const [temp,    setTemp]    = useState(55);
    const [kicker,  setKicker]  = useState(0.80);
    const [isDome,  setIsDome]  = useState(false);
    const [isGrass, setIsGrass] = useState(true);
    const [tab,     setTab]     = useState(0);

    const curProb = fgProb({ kick_distance: dist, is_dome: isDome, wind, temp,
      fg_make_rate_roll6: kicker, surface_is_grass: isGrass });

    const distData   = Array.from({ length: 45 }, (_, i) => ({ d: 18+i,
      p: fgProb({ kick_distance: 18+i, is_dome: isDome, wind, temp, fg_make_rate_roll6: kicker, surface_is_grass: isGrass }) }));
    const windData   = Array.from({ length: 31 }, (_, i) => ({ w: i,
      p: fgProb({ kick_distance: dist, is_dome: isDome, wind: i, temp, fg_make_rate_roll6: kicker, surface_is_grass: isGrass }) }));
    const tempData   = Array.from({ length: 21 }, (_, i) => ({ t: -10+i*5,
      p: fgProb({ kick_distance: dist, is_dome: isDome, wind, temp: -10+i*5, fg_make_rate_roll6: kicker, surface_is_grass: isGrass }) }));
    const kickerData = Array.from({ length: 21 }, (_, i) => ({ k: Math.round((0.55+i*0.02)*100),
      p: fgProb({ kick_distance: dist, is_dome: isDome, wind, temp, fg_make_rate_roll6: 0.55+i*0.02, surface_is_grass: isGrass }) }));
    const radarData  = [
      { factor: "Distance", value: Math.max(0, 1 - (dist - 18) / 44) },
      { factor: "Wind",     value: isDome ? 1 : Math.max(0, 1 - wind / 30) },
      { factor: "Temp",     value: isDome ? 1 : Math.min(1, Math.max(0, (temp + 10) / 80)) },
      { factor: "Kicker",   value: kicker },
      { factor: "Surface",  value: isGrass ? 0.65 : 0.82 },
      { factor: "Indoor",   value: isDome ? 1 : 0.45 },
    ];

    // ── Sidebar ─────────────────────────────────────────────────────────────
    const sidebar = h('div', {
      style: { width: 240, background: "#0a1a10", borderRight: "1px solid #1e4a2e",
        padding: 18, overflowY: "auto", flexShrink: 0 }
    },
      h('div', { style: { textAlign: "center", marginBottom: 16 } }, h(ProbGauge, { prob: curProb })),
      h('div', { style: { height: 1, background: "#1e4a2e", marginBottom: 14 } }),
      h('div', { style: { fontSize: 9, color: "#3a6a4a", letterSpacing: "0.1em", marginBottom: 10 } }, "SITUATION CONTROLS"),
      h(Slider, { label: "KICK DISTANCE", value: dist, min: 18, max: 62, onChange: setDist, unit: " yd" }),
      h(Slider, { label: "WIND SPEED", value: wind, min: 0, max: 30, onChange: setWind, unit: " mph" }),
      h(Slider, { label: "TEMPERATURE", value: temp, min: -10, max: 90, onChange: setTemp, unit: "°F" }),
      h(Slider, { label: "KICKER FORM (6-game)", value: kicker, min: 0.55, max: 1.0, step: 0.01,
        onChange: setKicker, fmt: v => Math.round(v * 100) + "%" }),
      h('div', { style: { height: 1, background: "#1e4a2e", margin: "14px 0" } }),
      h('div', { style: { fontSize: 9, color: "#3a6a4a", letterSpacing: "0.1em", marginBottom: 10 } }, "CONDITIONS"),
      h(Toggle, { label: "DOME / INDOOR", value: isDome, onChange: setIsDome }),
      h(Toggle, { label: "NATURAL GRASS", value: isGrass, onChange: setIsGrass }),
      isDome && h('div', {
        style: { background: "#1a3a26", borderRadius: 6, padding: "7px 9px", fontSize: 9, color: "#8aaa96" }
      }, "↳ Wind & temp controlled indoors")
    );

    // ── Tab bar ──────────────────────────────────────────────────────────────
    const tabBar = h('div', {
      style: { display: "flex", border: "1px solid #1e4a2e", borderRadius: 8,
        overflow: "hidden", marginBottom: 18 }
    },
      ...TABS.map((t, i) => h('button', {
        key: t,
        onClick: () => setTab(i),
        style: { flex: 1, padding: "9px 0", background: tab === i ? NFL_GREEN : "transparent",
          border: "none", color: tab === i ? GOLD : "#4a7a5a", cursor: "pointer",
          fontSize: 10, letterSpacing: "0.06em", fontWeight: tab === i ? 700 : 400,
          transition: "all 0.2s",
          borderRight: i < TABS.length - 1 ? "1px solid #1e4a2e" : "none" }
      }, t.toUpperCase()))
    );

    // ── Tab 0: Distance ───────────────────────────────────────────────────────
    const tab0 = h('div', null,
      h('div', { style: { fontSize: 10, color: "#3a6a4a", marginBottom: 10 } },
        "P(MAKE) VS KICK DISTANCE — current conditions fixed"),
      h('div', { style: { height: 260 } },
        h(ResponsiveContainer, { width: "100%", height: "100%" },
          h(AreaChart, { data: distData, margin },
            h(GradDef, { id: "gd", color: ACCENT }),
            h(CartesianGrid, { stroke: "#1e4a2e", strokeDasharray: "3 3" }),
            h(XAxis, { dataKey: "d", tick: axStyle,
              label: { value: "yards", position: "insideBottom", offset: -2, ...axStyle } }),
            h(YAxis, { domain: [0,1], tickFormatter: pctFmt, tick: axStyle }),
            h(Tooltip, { ...ttStyle,
              formatter: v => [pctFmt(v), "P(make)"],
              labelFormatter: v => v + " yards" }),
            h(Area, { type: "monotone", dataKey: "p", stroke: ACCENT,
              strokeWidth: 2, fill: "url(#gd)", dot: false })
          )
        )
      ),
      h('div', { style: { display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 8, marginTop: 16 } },
        ...[["≤30 yd", 25], ["31–40 yd", 36], ["41–50 yd", 46], ["51–55 yd", 53], ["56+ yd", 59]]
          .map(([label, d]) => h(StatCard, { key: label, label,
            prob: fgProb({ kick_distance: d, is_dome: isDome, wind, temp,
              fg_make_rate_roll6: kicker, surface_is_grass: isGrass }) }))
      )
    );

    // ── Tab 1: Wind & Temp ────────────────────────────────────────────────────
    const tab1 = h('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 } },
      // Wind chart
      h('div', null,
        h('div', { style: { fontSize: 10, color: "#3a6a4a", marginBottom: 10 } },
          "P(MAKE) VS WIND SPEED AT " + dist + " YD"),
        h('div', { style: { height: 230 } },
          h(ResponsiveContainer, { width: "100%", height: "100%" },
            h(AreaChart, { data: windData, margin },
              h(GradDef, { id: "gw", color: GOLD }),
              h(CartesianGrid, { stroke: "#1e4a2e", strokeDasharray: "3 3" }),
              h(XAxis, { dataKey: "w", tick: axStyle,
                label: { value: "mph", position: "insideBottom", offset: -2, ...axStyle } }),
              h(YAxis, { domain: [0,1], tickFormatter: pctFmt, tick: axStyle }),
              h(Tooltip, { ...ttStyle, formatter: v => [pctFmt(v), "P(make)"],
                labelFormatter: v => v + " mph" }),
              h(Area, { type: "monotone", dataKey: "p", stroke: GOLD,
                strokeWidth: 2, fill: "url(#gw)", dot: false })
            )
          )
        ),
        isDome && h('div', { style: { fontSize: 9, color: "#4a7a5a", textAlign: "center", marginTop: 6 } },
          "⚠ Dome — wind has no effect")
      ),
      // Temp chart
      h('div', null,
        h('div', { style: { fontSize: 10, color: "#3a6a4a", marginBottom: 10 } },
          "P(MAKE) VS TEMPERATURE AT " + dist + " YD"),
        h('div', { style: { height: 230 } },
          h(ResponsiveContainer, { width: "100%", height: "100%" },
            h(AreaChart, { data: tempData, margin },
              h(GradDef, { id: "gt", color: "#60a5fa" }),
              h(CartesianGrid, { stroke: "#1e4a2e", strokeDasharray: "3 3" }),
              h(XAxis, { dataKey: "t", tick: axStyle,
                label: { value: "°F", position: "insideBottom", offset: -2, ...axStyle } }),
              h(YAxis, { domain: [0,1], tickFormatter: pctFmt, tick: axStyle }),
              h(Tooltip, { ...ttStyle, formatter: v => [pctFmt(v), "P(make)"],
                labelFormatter: v => v + "°F" }),
              h(Area, { type: "monotone", dataKey: "p", stroke: "#60a5fa",
                strokeWidth: 2, fill: "url(#gt)", dot: false })
            )
          )
        ),
        isDome && h('div', { style: { fontSize: 9, color: "#4a7a5a", textAlign: "center", marginTop: 6 } },
          "⚠ Dome — temp fixed at 72°F")
      ),
      // Scenario cards
      h('div', { style: { gridColumn: "1 / -1" } },
        h('div', { style: { fontSize: 10, color: "#3a6a4a", marginBottom: 10 } },
          "SCENARIO COMPARISON AT " + dist + " YD"),
        h('div', { style: { display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8 } },
          ...[
            ["Calm indoor",  { is_dome: true,  wind: 0,  temp: 72 }],
            ["Mild outdoor", { is_dome: false, wind: 5,  temp: 65 }],
            ["Windy cold",   { is_dome: false, wind: 20, temp: 35 }],
            ["Blizzard",     { is_dome: false, wind: 30, temp: 15 }],
          ].map(([label, cond]) => h(StatCard, { key: label, label,
            prob: fgProb({ kick_distance: dist, fg_make_rate_roll6: kicker,
              surface_is_grass: isGrass, ...cond }) }))
        )
      )
    );

    // ── Tab 2: Kicker Form ────────────────────────────────────────────────────
    const tab2 = h('div', null,
      h('div', { style: { fontSize: 10, color: "#3a6a4a", marginBottom: 10 } },
        "P(MAKE) VS KICKER ROLLING MAKE RATE AT " + dist + " YD"),
      h('div', { style: { height: 250 } },
        h(ResponsiveContainer, { width: "100%", height: "100%" },
          h(AreaChart, { data: kickerData, margin },
            h(GradDef, { id: "gk", color: "#f472b6" }),
            h(CartesianGrid, { stroke: "#1e4a2e", strokeDasharray: "3 3" }),
            h(XAxis, { dataKey: "k", tick: axStyle, tickFormatter: v => v + "%" }),
            h(YAxis, { domain: [0,1], tickFormatter: pctFmt, tick: axStyle }),
            h(Tooltip, { ...ttStyle, formatter: v => [pctFmt(v), "P(make)"],
              labelFormatter: v => "Kicker at " + v + "% form" }),
            h(Area, { type: "monotone", dataKey: "p", stroke: "#f472b6",
              strokeWidth: 2, fill: "url(#gk)", dot: false })
          )
        )
      ),
      h('div', { style: { display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10, marginTop: 18 } },
        ...[["Struggling\n(60%)", 0.60], ["League Avg\n(80%)", 0.80],
            ["Good\n(90%)", 0.90], ["Elite\n(95%)", 0.95]].map(([label, k]) => {
          const p = fgProb({ kick_distance: dist, is_dome: isDome, wind, temp,
            fg_make_rate_roll6: k, surface_is_grass: isGrass });
          const col = p > 0.75 ? ACCENT : p > 0.55 ? GOLD : DANGER;
          return h('div', { key: label,
            style: { background: "#0f2219", border: "1px solid " + col + "40",
              borderRadius: 8, padding: "14px 8px", textAlign: "center" }
          },
            h('div', { style: { fontSize: 22, fontFamily: "'Bebas Neue',sans-serif", color: col } },
              Math.round(p * 100) + "%"),
            h('div', { style: { fontSize: 9, color: "#8aaa96", whiteSpace: "pre-line", marginTop: 4 } }, label)
          );
        })
      ),
      h('div', { style: { marginTop: 16, background: "#0f2219", borderRadius: 8, padding: 14 } },
        h('div', { style: { fontSize: 9, color: "#3a6a4a", marginBottom: 10 } },
          "SURFACE EFFECT AT " + dist + " YD"),
        h('div', { style: { display: "flex", gap: 12 } },
          ...[["Natural Grass", true], ["Artificial Turf", false]].map(([label, g]) => {
            const p = fgProb({ kick_distance: dist, is_dome: isDome, wind, temp,
              fg_make_rate_roll6: kicker, surface_is_grass: g });
            return h('div', { key: label, style: { flex: 1, textAlign: "center" } },
              h('div', { style: { fontSize: 24, fontFamily: "'Bebas Neue',sans-serif",
                color: g ? ACCENT : GOLD } }, Math.round(p * 100) + "%"),
              h('div', { style: { fontSize: 10, color: "#8aaa96" } }, label)
            );
          })
        )
      )
    );

    // ── Tab 3: Radar ──────────────────────────────────────────────────────────
    const tab3 = h('div', null,
      h('div', { style: { fontSize: 10, color: "#3a6a4a", marginBottom: 10 } },
        "FACTOR STRENGTH RADAR — normalized favorable contribution"),
      h('div', { style: { height: 320 } },
        h(ResponsiveContainer, { width: "100%", height: "100%" },
          h(RadarChart, { data: radarData },
            h(PolarGrid, { stroke: "#1e4a2e" }),
            h(PolarAngleAxis, { dataKey: "factor",
              tick: { fill: LIGHT, fontSize: 11, fontFamily: "'DM Mono',monospace" } }),
            h(Radar, { name: "Factor", dataKey: "value", stroke: GOLD,
              fill: GOLD, fillOpacity: 0.2, strokeWidth: 2 })
          )
        )
      ),
      h('div', { style: { display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginTop: 12 } },
        ...radarData.map(({ factor, value }) => {
          const col = value > 0.7 ? ACCENT : value > 0.4 ? GOLD : DANGER;
          return h('div', { key: factor,
            style: { background: "#0f2219", borderRadius: 8, padding: "10px 12px",
              display: "flex", justifyContent: "space-between", alignItems: "center" }
          },
            h('span', { style: { fontSize: 10, color: "#8aaa96" } }, factor),
            h('div', { style: { display: "flex", alignItems: "center", gap: 6 } },
              h('div', { style: { width: 48, height: 4, background: "#1e4a2e", borderRadius: 2 } },
                h('div', { style: { width: Math.round(value * 100) + "%", height: "100%",
                  background: col, borderRadius: 2, transition: "width 0.3s" } })
              ),
              h('span', { style: { fontSize: 10, color: col, fontWeight: 700, width: 26 } },
                Math.round(value * 100))
            )
          );
        })
      )
    );

    // ── Layout ────────────────────────────────────────────────────────────────
    return h('div', {
      style: { minHeight: "100vh", background: DARK, color: WHITE,
        fontFamily: "'DM Mono',monospace", display: "flex", flexDirection: "column" }
    },
      // Header
      h('div', {
        style: { background: NFL_GREEN, borderBottom: "3px solid " + GOLD,
          padding: "14px 20px", display: "flex", alignItems: "baseline",
          gap: 14, flexShrink: 0 }
      },
        h('div', { style: { fontSize: 30, fontFamily: "'Bebas Neue',sans-serif",
          letterSpacing: "0.1em", color: GOLD } }, "🏈 FG PROBABILITY EXPLORER"),
        h('div', { style: { fontSize: 10, color: "#8aaa96", letterSpacing: "0.06em" } },
          "NFL 2016–2024 · LOGISTIC MODEL")
      ),
      // Body
      h('div', { style: { display: "flex", flex: 1, overflow: "hidden" } },
        sidebar,
        h('div', { style: { flex: 1, padding: 20, overflowY: "auto" } },
          tabBar,
          tab === 0 ? tab0 : tab === 1 ? tab1 : tab === 2 ? tab2 : tab3
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
})();
</script>
</body>
</html>
